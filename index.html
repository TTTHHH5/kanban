<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanban Board — 로그인</title>
  <link rel="stylesheet" href="landing.css" />
</head>
<body>
  <div class="landing-wrap">
    <div class="landing-card">
      <div class="logo">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="40" height="40" rx="10" fill="#0052cc"/>
          <rect x="8" y="10" width="7" height="20" rx="2" fill="white" opacity="0.9"/>
          <rect x="17" y="10" width="7" height="14" rx="2" fill="white" opacity="0.7"/>
          <rect x="26" y="10" width="7" height="8" rx="2" fill="white" opacity="0.5"/>
        </svg>
      </div>
      <h1>Kanban Board</h1>
      <p class="subtitle">작업을 체계적으로 관리하세요.<br/>소셜 계정으로 간편하게 시작할 수 있습니다.</p>

      <!-- 소셜 로그인 -->
      <div class="btn-group">
        <button class="btn btn-google" id="btn-google">
          <svg width="20" height="20" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          Google로 계속하기
        </button>

        <button class="btn btn-github" id="btn-github">
          <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path fill="currentColor" d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
          </svg>
          GitHub로 계속하기
        </button>
      </div>

      <div class="divider"><span>또는 이메일로 로그인</span></div>

      <!-- 이메일 로그인 폼 -->
      <form class="email-form" id="login-form" novalidate>
        <input type="email" id="login-email" placeholder="이메일" autocomplete="email" required />
        <input type="password" id="login-password" placeholder="비밀번호" autocomplete="current-password" required />
        <p class="form-error" id="login-error"></p>
        <button type="submit" class="btn btn-email" id="btn-login">로그인</button>
      </form>

      <p class="signup-link">
        계정이 없으신가요?
        <button class="link-btn" id="btn-open-signup">회원가입</button>
      </p>

      <p class="terms">로그인 시 <a href="#">이용약관</a> 및 <a href="#">개인정보처리방침</a>에 동의하게 됩니다.</p>
    </div>
  </div>

  <!-- 회원가입 모달 -->
  <div class="signup-overlay" id="signup-overlay">
    <div class="signup-modal">
      <div class="signup-modal-header">
        <h2>회원가입</h2>
        <button class="modal-close-btn" id="btn-close-signup" aria-label="닫기">✕</button>
      </div>
      <form class="email-form" id="signup-form" novalidate>
        <input type="email" id="signup-email" placeholder="이메일" autocomplete="email" required />
        <input type="password" id="signup-password" placeholder="비밀번호 (6자 이상)" autocomplete="new-password" minlength="6" required />
        <input type="password" id="signup-password-confirm" placeholder="비밀번호 확인" autocomplete="new-password" required />
        <p class="form-error" id="signup-error"></p>
        <p class="form-success" id="signup-success"></p>
        <div class="signup-actions">
          <button type="button" class="btn btn-cancel" id="btn-cancel-signup">취소</button>
          <button type="submit" class="btn btn-email" id="btn-signup">회원가입</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script>
    (async () => {
      const user = await getAuthUser();
      if (user) { window.location.href = 'board.html'; return; }

      // 소셜 로그인
      document.getElementById('btn-google').addEventListener('click', signInWithGoogle);
      document.getElementById('btn-github').addEventListener('click', signInWithGitHub);

      // ── 이메일 로그인 ──────────────────────────────────────────
      const loginForm = document.getElementById('login-form');
      const loginError = document.getElementById('login-error');
      const loginBtn = document.getElementById('btn-login');

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        loginError.textContent = '';
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;

        loginBtn.disabled = true;
        loginBtn.textContent = '로그인 중...';

        const { error } = await signInWithEmail(email, password);

        if (error) {
          loginError.textContent = translateError(error.message);
          loginBtn.disabled = false;
          loginBtn.textContent = '로그인';
          return;
        }
        window.location.href = 'board.html';
      });

      // ── 회원가입 모달 ──────────────────────────────────────────
      const overlay = document.getElementById('signup-overlay');
      const signupForm = document.getElementById('signup-form');
      const signupError = document.getElementById('signup-error');
      const signupSuccess = document.getElementById('signup-success');
      const signupBtn = document.getElementById('btn-signup');

      function openSignup() {
        overlay.classList.add('active');
        document.getElementById('signup-email').focus();
      }

      function closeSignup() {
        overlay.classList.remove('active');
        signupForm.reset();
        signupError.textContent = '';
        signupSuccess.textContent = '';
        signupBtn.disabled = false;
        signupBtn.textContent = '회원가입';
      }

      document.getElementById('btn-open-signup').addEventListener('click', openSignup);
      document.getElementById('btn-close-signup').addEventListener('click', closeSignup);
      document.getElementById('btn-cancel-signup').addEventListener('click', closeSignup);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) closeSignup(); });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSignup(); });

      signupForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        signupError.textContent = '';
        signupSuccess.textContent = '';

        const email = document.getElementById('signup-email').value.trim();
        const password = document.getElementById('signup-password').value;
        const confirm = document.getElementById('signup-password-confirm').value;

        if (password !== confirm) {
          signupError.textContent = '비밀번호가 일치하지 않습니다.';
          return;
        }

        signupBtn.disabled = true;
        signupBtn.textContent = '처리 중...';

        const { data, error } = await signUpWithEmail(email, password);

        if (error) {
          signupError.textContent = translateError(error.message);
          signupBtn.disabled = false;
          signupBtn.textContent = '회원가입';
          return;
        }

        if (!data.session) {
          signupSuccess.textContent = '가입 확인 이메일을 발송했습니다. 이메일을 확인 후 로그인해주세요.';
          signupBtn.disabled = false;
          signupBtn.textContent = '회원가입';
          return;
        }

        window.location.href = 'board.html';
      });

      // ── 에러 번역 ──────────────────────────────────────────────
      function translateError(msg) {
        if (msg.includes('Invalid login credentials')) return '이메일 또는 비밀번호가 올바르지 않습니다.';
        if (msg.includes('Email not confirmed')) return '이메일 인증이 필요합니다. 받은 편지함을 확인해주세요.';
        if (msg.includes('already registered')) return '이미 가입된 이메일입니다. 로그인을 시도해보세요.';
        if (msg.includes('Password should be')) return '비밀번호는 6자 이상이어야 합니다.';
        return msg;
      }
    })();
  </script>
</body>
</html>
