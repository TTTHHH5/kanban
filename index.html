<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanban Board — 로그인</title>
  <link rel="stylesheet" href="landing.css" />
</head>
<body>
  <div class="landing-wrap">
    <div class="landing-card">
      <div class="logo">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="40" height="40" rx="10" fill="#0052cc"/>
          <rect x="8" y="10" width="7" height="20" rx="2" fill="white" opacity="0.9"/>
          <rect x="17" y="10" width="7" height="14" rx="2" fill="white" opacity="0.7"/>
          <rect x="26" y="10" width="7" height="8" rx="2" fill="white" opacity="0.5"/>
        </svg>
      </div>
      <h1>Kanban Board</h1>
      <p class="subtitle">작업을 체계적으로 관리하세요.<br/>소셜 계정으로 간편하게 시작할 수 있습니다.</p>

      <div class="btn-group">
        <button class="btn btn-google" id="btn-google">
          <svg width="20" height="20" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          Google로 계속하기
        </button>

        <button class="btn btn-github" id="btn-github">
          <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path fill="currentColor" d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
          </svg>
          GitHub로 계속하기
        </button>
      </div>

      <div class="divider"><span>또는 이메일로 계속하기</span></div>

      <form class="email-form" id="email-form" novalidate>
        <input type="email" id="input-email" placeholder="이메일" autocomplete="email" required />
        <input type="password" id="input-password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password" minlength="6" required />
        <p class="form-error" id="form-error"></p>
        <button type="submit" class="btn btn-email" id="btn-email-submit">로그인</button>
      </form>

      <p class="toggle-mode">
        계정이 없으신가요?
        <button class="link-btn" id="btn-toggle-mode">회원가입</button>
      </p>

      <p class="terms">로그인 시 <a href="#">이용약관</a> 및 <a href="#">개인정보처리방침</a>에 동의하게 됩니다.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script>
    (async () => {
      const user = await getAuthUser();
      if (user) { window.location.href = 'board.html'; return; }

      document.getElementById('btn-google').addEventListener('click', signInWithGoogle);
      document.getElementById('btn-github').addEventListener('click', signInWithGitHub);

      // 로그인 / 회원가입 모드 전환
      let isSignUp = false;
      const submitBtn = document.getElementById('btn-email-submit');
      const toggleBtn = document.getElementById('btn-toggle-mode');
      const formError = document.getElementById('form-error');
      const passwordInput = document.getElementById('input-password');

      toggleBtn.addEventListener('click', () => {
        isSignUp = !isSignUp;
        submitBtn.textContent = isSignUp ? '회원가입' : '로그인';
        toggleBtn.textContent = isSignUp ? '로그인' : '회원가입';
        document.querySelector('.toggle-mode').firstChild.textContent = isSignUp
          ? '이미 계정이 있으신가요? '
          : '계정이 없으신가요? ';
        passwordInput.autocomplete = isSignUp ? 'new-password' : 'current-password';
        formError.textContent = '';
      });

      document.getElementById('email-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        formError.textContent = '';
        const email = document.getElementById('input-email').value.trim();
        const password = passwordInput.value;

        submitBtn.disabled = true;
        submitBtn.textContent = '처리 중...';

        const fn = isSignUp ? signUpWithEmail : signInWithEmail;
        const { data, error } = await fn(email, password);

        if (error) {
          formError.textContent = translateError(error.message);
          submitBtn.disabled = false;
          submitBtn.textContent = isSignUp ? '회원가입' : '로그인';
          return;
        }

        if (isSignUp && !data.session) {
          formError.style.color = '#006644';
          formError.textContent = '가입 확인 이메일을 발송했습니다. 이메일을 확인해주세요.';
          submitBtn.disabled = false;
          submitBtn.textContent = '회원가입';
          return;
        }

        window.location.href = 'board.html';
      });

      function translateError(msg) {
        if (msg.includes('Invalid login credentials')) return '이메일 또는 비밀번호가 올바르지 않습니다.';
        if (msg.includes('Email not confirmed')) return '이메일 인증이 필요합니다. 받은 편지함을 확인해주세요.';
        if (msg.includes('already registered')) return '이미 가입된 이메일입니다. 로그인을 시도해보세요.';
        if (msg.includes('Password should be')) return '비밀번호는 6자 이상이어야 합니다.';
        return msg;
      }
    })();
  </script>
</body>
</html>
